<title>Asoleamiento Plan Norte</title>
<meta name="claude:viewport-fit-sides" content="cover">
__HEADEXTRA__
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,500;0,700;1,500&family=IBM+Plex+Sans+Condensed:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: mesa de trabajo — modelo 3D a la izquierda como plano de calco, panel de lectura técnica a la derecha */
:root{
  --bg:#eef0ea; --panel:#f8f8f4; --fg:#1d2430; --muted:#646b72; --line:#cfd3c9;
  --ink:#2c4a6b; --sun:#d98a1c; --sun-soft:#f3dcb1; --alert:#b0412e; --ok:#4f7a52;
  --ground:#e3e6dc; --lot:#d6dccb; --res:#d8d2c6; --nores:#c58d68;
  --f-display:"Spectral",Georgia,"Times New Roman",serif;
  --f-ui:"IBM Plex Sans Condensed","Arial Narrow",Arial,sans-serif;
  --f-data:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12161c; --panel:#1a2028; --fg:#e6e3da; --muted:#9aa1a8; --line:#2f3742;
  --ink:#8fb2d6; --sun:#f0a43a; --sun-soft:#4a3a20; --alert:#e2775f; --ok:#8cbf8d;
  --ground:#232a32; --lot:#2b343d; --res:#b9b3a8; --nores:#b98463; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12161c; --panel:#1a2028; --fg:#e6e3da; --muted:#9aa1a8; --line:#2f3742;
  --ink:#8fb2d6; --sun:#f0a43a; --sun-soft:#4a3a20; --alert:#e2775f; --ok:#8cbf8d;
  --ground:#232a32; --lot:#2b343d; --res:#b9b3a8; --nores:#b98463; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-ui);font-size:14px;line-height:1.45;margin:0}
.app{display:grid;grid-template-columns:minmax(0,1fr) 400px;grid-template-rows:auto minmax(0,1fr);height:100%;}
header{grid-column:1/-1;display:flex;flex-wrap:wrap;align-items:center;gap:10px 22px;padding-block:12px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line)}
h1{font-family:var(--f-display);font-weight:700;font-size:22px;margin:0;letter-spacing:.2px;text-wrap:balance}
h1 em{font-style:italic;font-weight:500;color:var(--muted)}
.geo{font-family:var(--f-data);font-size:11.5px;color:var(--muted)}
.zones{display:flex;flex-wrap:wrap;gap:4px;margin-left:auto}
.zones button{font-family:var(--f-data);font-size:12.5px;border:1px solid var(--line);background:var(--panel);color:var(--fg);padding:5px 9px;border-radius:3px;cursor:pointer}
.zones button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.zones button:focus-visible,.seg button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--sun);outline-offset:2px}
.stage{position:relative;min-width:0;min-height:0}
#c{position:absolute;inset:0;width:100%;height:100%;display:block}
.hud{position:absolute;left:12px;bottom:12px;max-width:calc(100% - 24px);display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;
  background:color-mix(in srgb,var(--panel) 92%,transparent);border:1px solid var(--line);padding:10px 12px;border-radius:4px}
.hud label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);display:block}
.hud .grp{display:flex;flex-direction:column;gap:3px;min-width:0}
.hud input[type=range]{width:min(260px,60vw);accent-color:var(--sun)}
.readout{font-family:var(--f-data);font-size:12.5px;font-variant-numeric:tabular-nums}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:3px;overflow:hidden}
.seg button{border:0;background:transparent;color:var(--fg);font-family:var(--f-ui);font-size:12.5px;padding:4px 9px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--sun-soft);color:var(--fg);font-weight:600}
.chk{display:flex;gap:12px;flex-wrap:wrap;font-size:12.5px}
.chk input{accent-color:var(--ink)}
.play{border:1px solid var(--line);background:var(--panel);color:var(--fg);border-radius:3px;padding:4px 10px;cursor:pointer;font-family:var(--f-ui)}
.legend{position:absolute;top:12px;left:12px;background:color-mix(in srgb,var(--panel) 92%,transparent);border:1px solid var(--line);padding:8px 10px;border-radius:4px;font-size:11.5px}
.legend .bar{width:180px;height:9px;border-radius:2px;margin:4px 0 2px}
.legend .ticks{display:flex;justify-content:space-between;font-family:var(--f-data);font-size:10.5px;color:var(--muted)}
.sunbox{position:absolute;top:12px;right:12px;background:color-mix(in srgb,var(--panel) 92%,transparent);border:1px solid var(--line);padding:8px 10px;border-radius:4px;font-family:var(--f-data);font-size:11.5px;line-height:1.5}
aside{border-left:1px solid var(--line);background:var(--panel);overflow:auto;min-width:0;
  padding-block:16px 28px;padding-left:20px;padding-right:max(20px,env(safe-area-inset-right,0px))}
.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
h2{font-family:var(--f-display);font-size:28px;margin:2px 0 4px;line-height:1.1}
h3{font-family:var(--f-display);font-size:17px;margin:20px 0 6px}
.caracter{color:var(--muted);margin:0 0 12px}
.ind{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:3px;overflow:hidden}
.ind div{background:var(--panel);padding:6px 8px}
.ind b{display:block;font-family:var(--f-data);font-weight:500;font-size:14px;font-variant-numeric:tabular-nums}
.ind span{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.note{font-size:12px;color:var(--muted);margin-top:6px}
.lotcard{border-top:1px solid var(--line);padding-top:10px;margin-top:12px}
.lotcard h4{margin:0 0 6px;font-size:13.5px;font-weight:600}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th,td{padding:4px 6px;border-bottom:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums}
th:first-child,td:first-child{text-align:left}
th{font-weight:500;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.05em}
td.num{font-family:var(--f-data)}
.pill{display:inline-block;font-family:var(--f-data);font-size:11px;padding:1px 6px;border-radius:9px}
.pill.bad{background:color-mix(in srgb,var(--alert) 18%,transparent);color:var(--alert)}
.pill.mid{background:var(--sun-soft);color:var(--fg)}
.pill.good{background:color-mix(in srgb,var(--ok) 20%,transparent);color:var(--ok)}
.text p{margin:6px 0;max-width:62ch}
.q{border-left:3px solid var(--sun);padding:4px 0 4px 10px;font-family:var(--f-display);font-style:italic;font-size:15px;margin:10px 0}
.rec{background:color-mix(in srgb,var(--ink) 10%,transparent);padding:8px 10px;border-radius:3px;font-size:13px}
details{margin-top:18px;border-top:1px solid var(--line);padding-top:8px}
summary{cursor:pointer;font-family:var(--f-display);font-size:16px}
.disc td:nth-child(2){color:var(--muted)} .disc td{font-family:var(--f-data);font-size:12px}
.gen dt{font-weight:600;margin-top:8px}.gen dd{margin:2px 0 0;color:var(--muted)}
@media (max-width:860px){
  .app{grid-template-columns:1fr;grid-template-rows:auto 62vh auto;height:auto}
  aside{border-left:0;border-top:1px solid var(--line);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .zones{margin-left:0}
  .legend{display:none}
  .hud{position:static;margin:0;border-radius:0;border-left:0;border-right:0}
  .stage{display:flex;flex-direction:column}
  #c{position:relative;flex:1;min-height:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

.modes{display:inline-flex;border:1px solid var(--ink);border-radius:3px;overflow:hidden}
.modes button{border:0;background:transparent;color:var(--ink);font-family:var(--f-ui);font-weight:600;font-size:13px;padding:6px 12px;cursor:pointer}
.modes button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.modes button:focus-visible{outline:2px solid var(--sun);outline-offset:2px}
.headtools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-left:auto}
.headtools .zones{margin-left:0}
.form{display:grid;gap:10px;margin-top:10px}
.form .row{display:flex;flex-wrap:wrap;gap:8px;align-items:end}
.form label.f{display:flex;flex-direction:column;gap:3px;font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.form select,.form input[type=number]{font-family:var(--f-data);font-size:13px;padding:5px 6px;border:1px solid var(--line);border-radius:3px;background:var(--bg);color:var(--fg);min-width:0}
.form input[type=number]{width:82px}
.drop{border:1.5px dashed var(--line);border-radius:4px;padding:14px;text-align:center;cursor:pointer;background:var(--bg)}
.drop.over{border-color:var(--sun);background:var(--sun-soft)}
.drop b{font-family:var(--f-display);font-size:16px;font-weight:600;display:block}
.drop input{position:absolute;width:1px;height:1px;opacity:0}
.btn{font-family:var(--f-ui);font-size:13px;border:1px solid var(--line);background:var(--panel);color:var(--fg);border-radius:3px;padding:6px 11px;cursor:pointer}
.btn.primary{background:var(--alert);border-color:var(--alert);color:#fff;font-weight:600}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:focus-visible{outline:2px solid var(--sun);outline-offset:2px}
.status{font-family:var(--f-data);font-size:12px;color:var(--muted);min-height:1.4em}
.prog{height:4px;background:var(--line);border-radius:2px;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--sun);transition:width .2s}
.score{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin:12px 0}
.score div{border:1px solid var(--line);border-radius:3px;padding:6px 8px}
.score b{font-family:var(--f-data);font-size:20px;display:block}
.score span{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.score .c b{color:var(--alert)} .score .a b{color:var(--sun)} .score .o b{color:var(--ok)}
.finds{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.finds li{border:1px solid var(--line);border-left:4px solid var(--muted);border-radius:3px;padding:8px 10px;cursor:pointer}
.finds li.crit{border-left-color:var(--alert)} .finds li.aten{border-left-color:var(--sun)} .finds li.ok{border-left-color:var(--ok)}
.finds li:hover,.finds li:focus-visible{background:var(--bg);outline:none}
.finds .t{display:flex;gap:8px;align-items:baseline;font-weight:600}
.finds .n{font-family:var(--f-data);font-size:11px;border-radius:9px;padding:0 6px;color:#fff;background:var(--muted)}
.finds li.crit .n{background:var(--alert)} .finds li.aten .n{background:var(--sun)} .finds li.ok .n{background:var(--ok)}
.finds .d{font-size:12.5px;margin:3px 0 0}
.finds .r{font-size:12.5px;margin:4px 0 0;color:var(--ink)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:12.5px}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-family:var(--f-data)}
.hint{font-size:12px;color:var(--muted);background:var(--bg);border:1px solid var(--line);border-radius:3px;padding:6px 8px}
</style>
<div class="app">
<header>
  <div>
    <h1>Plan Particularizado Norte <em>· asoleamiento, visuales y correspondencias</em></h1>
    <div class="geo" id="geo"></div>
  </div>
  <div class="headtools">
    <div class="modes" id="modes" role="tablist" aria-label="Modo">
      <button data-m="plan" aria-pressed="true">Zonas del Plan</button><button data-m="proj" aria-pressed="false">Mi proyecto</button>
    </div>
    <nav class="zones" id="zones" aria-label="Zonas"></nav>
    __INSTALL__
  </div>
</header>
<section class="stage" aria-label="Modelo 3D">
  <canvas id="c"></canvas>
  <div class="legend" id="legend" hidden>
    <div class="eyebrow" id="legTitle">Horas de sol directo</div>
    <div class="bar" id="legBar"></div>
    <div class="ticks" id="legTicks"></div>
  </div>
  <div class="sunbox" id="sunbox"></div>
  <div class="hud">
    <div class="grp">
      <label for="day">Fecha</label>
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
        <div class="seg" id="presets">
          <button data-d="172" aria-pressed="true">21 jun</button><button data-d="265">22 sep</button><button data-d="355">21 dic</button>
        </div>
        <input type="range" id="day" min="1" max="365" step="1" value="172" aria-label="Día del año">
      </div>
      <span class="readout" id="dayOut"></span>
    </div>
    <div class="grp">
      <label for="hour">Hora oficial (UTC−3)</label>
      <div style="display:flex;gap:8px;align-items:center">
        <input type="range" id="hour" min="5" max="21" step="0.0833" value="15.5">
        <button class="play" id="play" aria-label="Animar el día">▶</button>
      </div>
      <span class="readout" id="hourOut"></span>
    </div>
    <div class="grp">
      <label>Suelo</label>
      <div class="seg" id="layer">
        <button data-l="live" aria-pressed="true">Sombra en vivo</button><button data-l="invierno" class="pl">h 21 jun</button><button data-l="equinoccio" class="pl">h equinoccio</button><button data-l="verano" class="pl">h 21 dic</button><button data-l="verano_arb" class="pl">h 21 dic + árboles</button><button data-l="reglas" class="pj" hidden>Ficha en el lote</button><button data-l="proyecto" class="pj" hidden>h 21 jun proyecto</button>
      </div>
      <div class="chk">
        <label style="text-transform:none;letter-spacing:0;color:var(--fg)"><input type="checkbox" id="tRef" checked> Referencias de ficha</label>
        <label style="text-transform:none;letter-spacing:0;color:var(--fg)"><input type="checkbox" id="tTree"> Arbolado</label>
        <label style="text-transform:none;letter-spacing:0;color:var(--fg)" class="pl"><input type="checkbox" id="tCorr" checked> Correspondencias</label>
        <label style="text-transform:none;letter-spacing:0;color:var(--fg)" class="pl"><input type="checkbox" id="tVis"> Visuales desde pisos altos</label>
        <label style="text-transform:none;letter-spacing:0;color:var(--fg)" class="pj" hidden><input type="checkbox" id="tEnv" checked> Volumen de referencia (lámina)</label>
        <label style="text-transform:none;letter-spacing:0;color:var(--fg)"><input type="checkbox" id="tPath" checked> Recorrido solar</label>
      </div>
    </div>
  </div>
</section>
<aside id="panel" aria-live="polite"></aside>
</div>
<script type="application/json" id="data">__DATA__</script>
